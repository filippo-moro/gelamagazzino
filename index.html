<title>GelaMagazzino</title>

<style>
:root{--bg:#faf8f5;--card:#fff;--brown:#d4a574;--brown2:#c4956a;--dark:#2d2118;--dark2:#3d2e22;--text:#1a1a2e;--muted:#999;--border:#f0ece8;--green:#4a9e6a;--blue:#8b9dc3;--red:#e07b4c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}

.header{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;padding:18px 24px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.header h1{font-family:'Playfair Display',serif;font-size:20px;font-weight:700}
.header small{font-size:11px;opacity:.7;letter-spacing:1px;display:block}
.header .mode-badge{margin-left:auto;background:rgba(255,255,255,.12);border:none;border-radius:10px;padding:8px 14px;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}

.nav{display:flex;background:var(--card);border-bottom:1px solid #eee;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.nav button{flex:1;padding:12px 8px;border:none;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;font-weight:600;border-bottom:3px solid transparent;transition:.2s}
.nav button.active{background:var(--bg);color:var(--brown);border-bottom-color:var(--brown)}

main{max-width:800px;margin:0 auto;padding:16px 16px 100px}

.card{background:var(--card);border-radius:14px;padding:16px 20px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card-accent{border-left:4px solid var(--brown)}
.card h4{font-size:16px;font-weight:700;margin-bottom:4px}
.card .sub{font-size:12px;color:#b0a090}
.card .count{font-size:12px;color:var(--muted);margin-top:4px}

.badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;display:inline-block;margin:2px}
.badge-on{background:#e8f5e8;color:#5a8a5a}
.badge-off{background:#f5f0eb;color:#ccc}

.btn{border:none;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--brown),var(--brown2));color:#fff;box-shadow:0 2px 8px rgba(196,149,106,.3)}
.btn-secondary{background:#f5f0eb;color:#8b7355}
.btn-green{background:linear-gradient(135deg,var(--green),#3d8a5a);color:#fff;box-shadow:0 2px 8px rgba(74,158,106,.3)}
.btn-small{padding:6px 12px;font-size:12px}
.btn-icon{background:none;border:none;padding:4px;color:#aaa}
.btn-icon.danger{color:#daa}

.chip{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:2px solid #e0dbd5;background:#fff;color:#888;display:inline-block;margin:3px}
.chip.active{border-color:var(--brown);background:var(--brown);color:#fff}

.input{width:100%;padding:10px 14px;border:2px solid #e8e8ef;border-radius:10px;font-size:14px;outline:none}
.input:focus{border-color:var(--brown)}
.label{display:block;font-size:13px;font-weight:600;color:#555;margin-bottom:6px}
.field{margin-bottom:18px}

.grid-row{display:grid;grid-template-columns:1fr 80px 80px;gap:8px;padding:12px 16px;align-items:center;border-left:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.grid-row:nth-child(odd){background:#fff}
.grid-row:nth-child(even){background:#fdfcfa}
.grid-header{display:grid;grid-template-columns:1fr 80px 80px;gap:8px;padding:10px 16px;font-size:11px;font-weight:700;color:var(--muted);background:#f5f0eb;text-transform:uppercase;letter-spacing:.5px}
.grid-header span:not(:first-child),.grid-row span:not(:first-child){text-align:center}

.inv-input{width:100%;text-align:center;padding:8px 4px;border:2px solid #e8e8ef;border-radius:8px;font-size:15px;outline:none;background:#fef9f3}
.ord-input{width:100%;text-align:center;padding:8px 4px;border:2px solid var(--brown);border-radius:8px;font-size:15px;font-weight:600;outline:none;background:#fff8f0}

.shop-tabs{display:flex;background:var(--card);border-radius:14px 14px 0 0;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.shop-tab{flex:1;padding:12px 10px;border:none;background:var(--card);color:#888;font-weight:700;font-size:13px;border-bottom:2px solid var(--border);font-family:inherit}
.shop-tab.active{background:var(--brown);color:#fff;border-bottom:none}

.section-title{margin:8px 0 12px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.section-sub{margin:2px 0 0 28px;font-size:12px;color:#aaa}

.empty{background:var(--card);border-radius:14px;padding:28px 20px;text-align:center;color:#bbb;font-size:14px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.04)}

.modal-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.modal{position:relative;background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:85vh;overflow:auto;box-shadow:0 24px 64px rgba(0,0,0,.2)}
.modal.wide{max-width:720px}
.modal-head{position:sticky;top:0;background:#fff;padding:20px 24px 12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;z-index:1}
.modal-head h3{font-size:18px;font-weight:700}
.modal-body{padding:24px}

.msg-box{background:var(--bg);border-radius:12px;padding:20px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word;border:1px solid #e8e8ef;margin-bottom:20px}

.setup-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
.setup-card{background:var(--card);border-radius:20px;padding:40px;max-width:420px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.1)}

.note-area{width:100%;padding:12px 14px;border:2px solid #e8e8ef;border-radius:10px;font-size:14px;outline:none;resize:vertical;background:#fff;font-family:inherit;min-height:80px}

.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.sync-dot.on{background:#4a9e6a}
.sync-dot.off{background:#e07b4c}

.list-item{padding:12px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}

.supplier-section{margin-bottom:24px}
.supplier-section h4{font-size:13px;font-weight:700;color:var(--brown);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}

@media(max-width:400px){
  .grid-header,.grid-row{grid-template-columns:1fr 65px 65px;gap:4px;padding:10px 12px}
  .shop-tab{font-size:12px;padding:10px 6px}
}

.stk-date{font-size:11px;color:#aaa;margin-top:2px}
.stk-date.old{color:var(--red);font-weight:600}
.cmp-wrap{background:var(--card);border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.06);overflow-x:auto;margin-top:12px}
.cmp-table{width:100%;border-collapse:collapse;font-size:13px}
.cmp-table th{padding:8px 6px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;background:#f5f0eb;white-space:nowrap;text-align:center}
.cmp-table th.shop{color:var(--dark);border-bottom:3px solid var(--brown);font-size:12px}
.cmp-table th.shop small{display:block;font-weight:500;text-transform:none;letter-spacing:0;color:#aaa;font-size:10px}
.cmp-table th.shop small.old{color:var(--red)}
.cmp-table th:first-child,.cmp-table td:first-child{text-align:left;padding-left:14px;position:sticky;left:0;background:inherit}
.cmp-table th:first-child{background:#f5f0eb}
.cmp-table td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--border);min-width:48px}
.cmp-table tr:nth-child(even) td{background:#fdfcfa}
.cmp-table tr:nth-child(odd) td{background:#fff}
.cmp-table td.ord{font-weight:700;color:var(--green)}
.cmp-table td.na{color:#ddd}
.cmp-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:10000;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast.err{background:var(--red)}
.db-error{background:#fdecea;color:#b3412b;padding:12px 16px;font-size:13px;font-weight:600;text-align:center}
.lock-link{background:none;border:none;color:#aaa;font-size:12px;margin-top:20px;text-decoration:underline}

/* ── Schermata PIN ── */
.pin-screen{position:fixed;inset:0;background:linear-gradient(135deg,var(--dark),var(--dark2));display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:20px}
.pin-screen h1{font-family:'Playfair Display',serif;color:#fff;font-size:32px;margin-bottom:8px}
.pin-screen .pin-sub{color:rgba(255,255,255,.7);font-size:14px;margin-bottom:32px;text-align:center}
.pin-display{display:flex;gap:14px;margin-bottom:32px}
.pin-dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:transparent;transition:.2s}
.pin-dot.filled{background:var(--brown);border-color:var(--brown);transform:scale(1.1)}
.pin-screen.error .pin-dot{border-color:var(--red);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pin-key{width:72px;height:72px;border-radius:50%;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:26px;font-weight:600;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent}
.pin-key:active{background:rgba(255,255,255,.25);transform:scale(.95)}
.pin-key.del{background:transparent;font-size:20px}
.pin-key.empty{background:transparent;cursor:default;pointer-events:none}
.pin-msg{color:var(--red);font-size:13px;margin-top:18px;min-height:18px;font-weight:600}
</style>
</head>

// ── Firebase Init ──
function initFirebase() {
  if (FIREBASE_CONFIG.apiKey === "INSERISCI-QUI-IL-TUO-API-KEY") {
    console.warn("Firebase non configurato - uso localStorage");
    loadFromLocal();
    render();
    return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
  } catch(e) {
    console.error("Firebase error:", e);
    db = null;
    dbError = "Impossibile avviare il collegamento al database. Ricarica la pagina.";
    render();
    return;
  }

  // Stato reale della connessione (pallino verde/rosso)
  db.ref('.info/connected').on('value', snap => {
    connected = !!snap.val();
    document.querySelectorAll('.sync-dot').forEach(d => {
      d.classList.toggle('on', connected);
      d.classList.toggle('off', !connected);
    });
  });

  // I dati si leggono solo dopo l'accesso con il PIN
  firebase.auth().onAuthStateChanged(user => {
    if (user && !user.isAnonymous) {
      hidePinScreen();
      attachDbListeners();
      render();
    } else {
      detachDbListeners();
      document.getElementById('app').innerHTML = '';
      if (user) { firebase.auth().signOut(); return; } // vecchie sessioni anonime
      showPinScreen();
    }
  });
}

const DB_NODES = ['config', 'stock', 'stockDates', 'notes', 'drafts'];

function onDbError(err) {
  console.error("Errore database:", err);
  dbError = (err && err.code === 'PERMISSION_DENIED')
    ? "Accesso ai dati negato. Esci e reinserisci il PIN."
    : "Errore nel leggere i dati. Controlla la connessione.";
  render();
}

function attachDbListeners() {
  if (listenersOn) return;
  listenersOn = true;
  dbError = null;

  db.ref('config').on('value', snap => {
    const d = snap.val();
    if (d) {
      state.shops = d.shops || DEFAULTS.shops;
      state.suppliers = d.sups || DEFAULTS.suppliers;
      state.products = d.prods || DEFAULTS.products;
    } else {
      // First time: write defaults
      state.shops = DEFAULTS.shops;
      state.suppliers = DEFAULTS.suppliers;
      state.products = DEFAULTS.products;
      w(db.ref('config').set({ shops: state.shops, sups: state.suppliers, prods: state.products }));
    }
    if (state.selSup) state.selSup = state.suppliers.find(s => s.id === state.selSup.id) || null;
    scheduleRender();
  }, onDbError);

  db.ref('stock').on('value', snap => {
    state.stock = snap.val() || {};
    scheduleRender();
  }, onDbError);

  db.ref('stockDates').on('value', snap => {
    state.stockDates = snap.val() || {};
    scheduleRender();
  }, onDbError);

  db.ref('notes').on('value', snap => {
    state.notes = snap.val() || {};
    scheduleRender();
  }, onDbError);

  // Quantità d'ordine in corso (condivise tra i dispositivi)
  db.ref('drafts').on('value', snap => {
    state.allDrafts = snap.val() || {};
    if (state.selSup) {
      state.draft = state.allDrafts[state.selSup.id] || {};
    }
    scheduleRender();
  }, onDbError);

  if (state.cmpSup) watchHistory(state.cmpSup);
}

// Storico: ultimi ordini inviati del fornitore scelto nel Confronto
const HISTORY_SHOWN = 5;
function watchHistory(supId) {
  if (histRef) { histRef.off(); histRef = null; }
  state.history = {};
  if (!db || !listenersOn || !supId) return;
  histRef = db.ref(`history/${supId}`).orderByKey().limitToLast(HISTORY_SHOWN);
  histRef.on('value', snap => {
    state.history = snap.val() || {};
    scheduleRender();
  }, onDbError);
}

function detachDbListeners() {
  if (!listenersOn || !db) return;
  if (histRef) { histRef.off(); histRef = null; }
  DB_NODES.forEach(n => db.ref(n).off());
  listenersOn = false;
}

// Segnala a schermo se un salvataggio viene rifiutato
function w(promise) {
  if (promise && promise.catch) promise.catch(err => {
    console.error("Salvataggio fallito:", err);
    toast("⚠ Non salvato! Controlla la connessione e riprova.", true);
  });
  return promise;
}

function toast(text, isErr) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), isErr ? 5000 : 2500);
}

// ── Ridisegno "gentile" ──
// Gli aggiornamenti che arrivano dagli altri dispositivi non ridisegnano
// la pagina mentre qualcuno sta scrivendo in un campo: aspettano che finisca.
function isEditing() {
  const a = document.activeElement;
  return !!a && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName) && document.getElementById('app').contains(a);
}
function scheduleRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => {
    if (isEditing()) { pendingRender = true; return; }
    pendingRender = false;
    render();
  }, 300);
}
document.addEventListener('focusout', () => {
  if (pendingRender) scheduleRender();
});

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Data dell'ultimo aggiornamento di una giacenza
function daysAgo(ts) {
  const d0 = new Date(); d0.setHours(0, 0, 0, 0);
  const d1 = new Date(ts); d1.setHours(0, 0, 0, 0);
  return Math.round((d0 - d1) / 86400000);
}
function fmtStockDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const n = daysAgo(ts);
  const hm = d.toLocaleTimeString("it-IT", { hour: '2-digit', minute: '2-digit' });
  const dm = d.toLocaleDateString("it-IT", { day: '2-digit', month: '2-digit' });
  if (n <= 0) return `oggi ${hm}`;
  if (n === 1) return `ieri ${hm}`;
  return `${dm} (${n} gg fa)`;
}
function stockDateHtml(prodId, shopId) {
  const ts = state.stockDates[`${prodId}_${shopId}`];
  if (!ts) return '';
  return `<div class="stk-date ${daysAgo(ts) >= STOCK_OLD_DAYS ? 'old' : ''}">giac. agg. ${fmtStockDate(ts)}</div>`;
}
// Ultimo aggiornamento giacenze di un negozio per un fornitore
function lastStockUpdate(supId, shopId) {
  let last = 0;
  prodsForSupShop(supId, shopId).forEach(p => {
    const ts = state.stockDates[`${p.id}_${shopId}`];
    if (ts && ts > last) last = ts;
  });
  return last;
}

function loadFromLocal() {
  try {
    const d = JSON.parse(localStorage.getItem('gm_data') || 'null');
    if (d) {
      state.shops = d.shops || DEFAULTS.shops;
      state.suppliers = d.sups || DEFAULTS.suppliers;
      state.products = d.prods || DEFAULTS.products;
      state.stock = d.stock || {};
      state.notes = d.notes || {};
    } else {
      state.shops = DEFAULTS.shops;
      state.suppliers = DEFAULTS.suppliers;
      state.products = DEFAULTS.products;
    }
    state.allDrafts = JSON.parse(localStorage.getItem('gm_drafts') || '{}');
  } catch(e) {
    state.shops = DEFAULTS.shops;
    state.suppliers = DEFAULTS.suppliers;
    state.products = DEFAULTS.products;
  }
}

// Salva solo l'elenco modificato ('shops', 'sups', 'prods'), non tutta la configurazione
function saveConfig(...parts) {
  const all = { shops: state.shops, sups: state.suppliers, prods: state.products };
  if (db) {
    const upd = {};
    (parts.length ? parts : Object.keys(all)).forEach(k => upd[k] = all[k]);
    w(db.ref('config').update(upd));
  } else {
    saveLocal();
  }
}

function saveLocal() {
  localStorage.setItem('gm_data', JSON.stringify({ shops: state.shops, sups: state.suppliers, prods: state.products, stock: state.stock, notes: state.notes }));
}

function saveStock(prodId, shopId, val) {
  const key = `${prodId}_${shopId}`;
  state.stock[key] = val;
  if (db) {
    // valore + data dell'ultimo aggiornamento, scritti insieme
    w(db.ref().update({
      [`stock/${key}`]: val,
      [`stockDates/${key}`]: firebase.database.ServerValue.TIMESTAMP
    }));
  } else {
    state.stockDates[key] = Date.now();
    saveLocal();
  }
}

function saveNote(supId, shopId, text) {
  const key = `${supId}_${shopId}`;
  state.notes[key] = { text, date: new Date().toISOString() };
  if (db) {
    w(db.ref(`notes/${key}`).set(state.notes[key]));
  } else {
    saveLocal();
  }
}

// ── Helpers ──
function gid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function prodsForSup(supId) { return state.products.filter(p => p.sid === supId); }
function prodsForSupShop(supId, shopId) { return state.products.filter(p => p.sid === supId && p.shops.includes(shopId)); }
function shopName(id) { return (state.shops.find(s => s.id === id) || {}).name || '?'; }

// ── Build Order Message ──
function buildMessage() {
  const sup = state.selSup;
  if (!sup) return null;
  const lines = [`📋 ORDINE ${sup.name}`, `📅 ${new Date().toLocaleDateString("it-IT")}`, ''];
  let hasItems = false;
  const relShops = state.shops.filter(s => sup.shopIds.includes(s.id));
  relShops.forEach(sh => {
    const items = [];
    prodsForSupShop(sup.id, sh.id).forEach(p => {
      const q = state.draft[`${p.id}_${sh.id}`];
      if (q && Number(q) > 0) items.push({ name: p.name, qty: Number(q), unit: p.u });
    });
    if (items.length > 0) {
      hasItems = true;
      lines.push(`🍦 ${sh.name.toUpperCase()}:`);
      items.forEach(it => lines.push(`• ${it.name} — ${it.qty}${it.u ? ' ' + it.u : ''}`));
      lines.push('');
    }
  });
  if (state.draftNote.trim()) { lines.push(`📝 Note: ${state.draftNote.trim()}`); lines.push(''); }
  if (!hasItems && !state.draftNote.trim()) return null;
  return lines.join('\n');
}

  // ── Setup Screen ──
  if (!state.mode) {
    app.appendChild(state.pickShop ? renderShopPicker() : renderSetup());
    return;
  }

  // ── Header ──
  const myShop = state.shops.find(s => s.id === state.shopId);
  const modeLabel = state.mode === 'negozio' ? `🍦 ${esc(myShop ? myShop.name : '')}` : '👤 Gestione';

  app.innerHTML = `
    <div class="header">
      <span style="font-size:28px">🍦</span>
      <div>
        <h1>GelaMagazzino</h1>
        <small>${DAYS[new Date().getDay()].toUpperCase()} — ${new Date().toLocaleDateString("it-IT")}</small>
      </div>
      <button class="mode-badge" onclick="resetMode()">
        <span class="sync-dot ${connected ? 'on' : 'off'}"></span>
        ${modeLabel}
      </button>
    </div>
    ${dbError ? `<div class="db-error">⚠ ${esc(dbError)}</div>` : ''}

  if (state.mode === 'negozio') {
    renderNegozio(app);

    renderGestione(app);

  // Render modal if open
  if (state.modal) renderModal(app);
  if (state.msgModal) renderMsgModal(app);
}

function openNegozioSup(supId) {

  state.draft = state.allDrafts[supId] || {};
  state.tab = 'order';
  render();
}

function closeNegozioSup() {
  state.selSup = null;
  state.tab = 'dash';
  render();
}

function generateNegozioOrder(supId) {
  const sup = state.suppliers.find(s => s.id === supId);
  if (!sup) return;
  const shopId = state.shopId;
  const shop = state.shops.find(s => s.id === shopId);
  const lines = [`📋 ORDINE ${sup.name}`, `📅 ${new Date().toLocaleDateString("it-IT")}`, ''];
  const items = [];
  prodsForSupShop(sup.id, shopId).forEach(p => {
    const q = state.draft[`${p.id}_${shopId}`];
    if (q && Number(q) > 0) items.push({ name: p.name, qty: Number(q), unit: p.u });
  });
  if (items.length > 0) {
    lines.push(`🍦 ${shop ? shop.name.toUpperCase() : ''}:`);
    items.forEach(it => lines.push(`• ${it.name} — ${it.qty}${it.u ? ' ' + it.u : ''}`));
    lines.push('');
  }
  const noteKey = `${sup.id}_${shopId}`;
  const n = state.notes[noteKey];
  if (n && n.text) { lines.push(`📝 Note: ${esc(n.text)}`); lines.push(''); }
  if (items.length === 0 && !(n && n.text)) return;
  state.msgModal = lines.join('\n');
  state.copied = false;
  render();
}

// ── Actions ──
function setTab(t) {
  state.tab = t; state.selSup = null;
  if (t === 'compare') {
    if (!state.suppliers.some(s => s.id === state.cmpSup)) state.cmpSup = state.suppliers[0] ? state.suppliers[0].id : null;
    state.cmpDate = 'now';
    watchHistory(state.cmpSup);
  }
  render();
}
function setCmpSup(id) { state.cmpSup = id; state.cmpDate = 'now'; watchHistory(id); render(); }
function setCmpDate(d) { state.cmpDate = d; render(); }

// ── Confronto negozi + storico ordini ──
function renderConfronto() {
  const sup = state.suppliers.find(s => s.id === state.cmpSup);
  let html = `<h3 class="section-title" style="margin-top:16px">📊 Confronto negozi</h3>`;
  if (!sup) return html + `<div class="empty">Nessun fornitore</div>`;

  const dates = Object.keys(state.history).sort().reverse();
  const cur = dates.includes(state.cmpDate) ? state.cmpDate : 'now';
  const relShops = state.shops.filter(s => sup.shopIds.includes(s.id));
  const fmtDay = k => { const [y, m, d] = k.split('-'); return `${d}/${m}`; };

  html += `<div class="field" style="margin-bottom:0"><label class="label">Fornitore</label>
    <select class="input" onchange="setCmpSup(this.value)">${state.suppliers.map(s => `<option value="${s.id}" ${s.id === sup.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div>`;

  html += `<div class="cmp-chips"><span class="chip ${cur === 'now' ? 'active' : ''}" onclick="setCmpDate('now')">Adesso</span>`;
  dates.forEach(d => { html += `<span class="chip ${cur === d ? 'active' : ''}" onclick="setCmpDate('${d}')">Ordine ${fmtDay(d)}</span>`; });
  html += `</div>`;
  if (dates.length === 0) html += `<p class="section-sub" style="margin:8px 0 0">Lo storico si riempie da solo: ogni ordine confermato come inviato viene salvato qui.</p>`;

  // righe: [nome, unità, {shopId: {g, o} | null}]
  const rows = [];
  if (cur === 'now') {
    const draft = state.allDrafts[sup.id] || {};
    prodsForSup(sup.id).forEach(p => {
      const cells = {};
      relShops.forEach(sh => {
        const k = `${p.id}_${sh.id}`;
        cells[sh.id] = p.shops.includes(sh.id) ? { g: state.stock[k], o: draft[k] } : null;
      });
      rows.push([p.name, p.u, cells]);
    });
  } else {
    const snap = state.history[cur] || {};
    const byProd = {};
    Object.entries(snap).forEach(([k, v]) => {
      const i = k.lastIndexOf('_');
      const pid = k.slice(0, i), shId = k.slice(i + 1);
      (byProd[pid] = byProd[pid] || { n: v.n, cells: {} }).cells[shId] = v;
    });
    // prima i prodotti ancora in elenco (nel loro ordine), poi quelli eliminati nel frattempo
    const order = prodsForSup(sup.id).map(p => p.id).filter(id => byProd[id]);
    Object.keys(byProd).forEach(id => { if (!order.includes(id)) order.push(id); });
    order.forEach(id => {
      const p = state.products.find(x => x.id === id);
      rows.push([p ? p.name : byProd[id].n, p ? p.u : '', byProd[id].cells]);
    });
  }

  html += `<div class="cmp-wrap"><table class="cmp-table"><thead><tr><th rowspan="2">Prodotto</th>`;
  relShops.forEach(sh => {
    let sub = '';
    if (cur === 'now') {
      const last = lastStockUpdate(sup.id, sh.id);
      sub = `<small class="${!last || daysAgo(last) >= STOCK_OLD_DAYS ? 'old' : ''}">giac. ${last ? fmtStockDate(last) : 'mai compilate'}</small>`;
    }
    html += `<th class="shop" colspan="2">${esc(sh.name)}${sub}</th>`;
  });
  html += `</tr><tr>${relShops.map(() => `<th>Giac.</th><th>Ord.</th>`).join('')}</tr></thead><tbody>`;
  const val = v => (v === undefined || v === null || v === '') ? '<span style="color:#ddd">—</span>' : esc(v);
  rows.forEach(([name, u, cells]) => {
    html += `<tr><td><strong>${esc(name)}</strong>${u ? ` <span style="font-size:11px;color:#aaa">(${esc(u)})</span>` : ''}</td>`;
    relShops.forEach(sh => {
      const c = cells[sh.id];
      if (c === null) html += `<td class="na" colspan="2">non previsto</td>`;
      else html += `<td>${val(c && c.g)}</td><td class="ord">${val(c && Number(c.o) > 0 ? c.o : '')}</td>`;
    });
    html += `</tr>`;
  });
  if (rows.length === 0) html += `<tr><td colspan="${1 + relShops.length * 2}" style="text-align:center;color:#bbb;padding:24px">Nessun dato</td></tr>`;
  html += `</tbody></table></div>`;
  return html;
}
function startOrder(supId) { state.selSup = state.suppliers.find(s => s.id === supId); state.draft = state.allDrafts[supId] || {}; state.draftNote = (state.notes[`${supId}_gestione`] || {}).text || ''; state.tab = 'order'; const rs = state.shops.filter(s => state.selSup.shopIds.includes(s.id)); state.shopTab = rs[0]?.id; render(); }
function setShopTab(id) { state.shopTab = id; render(); }
function cancelOrder() { state.selSup = null; state.tab = 'dash'; render(); }
function setDraft(pid, sid, val) {
  const key = `${pid}_${sid}`;
  state.draft[key] = val;
  const supId = state.selSup ? state.selSup.id : null;
  if (!supId) return;
  state.allDrafts[supId] = state.draft;
  if (db) {
    // solo questa quantità: non tocca quelle inserite dagli altri negozi
    w(db.ref(`drafts/${supId}/${key}`).set(val === '' ? null : val));
  } else {
    localStorage.setItem('gm_drafts', JSON.stringify(state.allDrafts));
  }
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// Fotografa giacenze e quantità ordinate nello storico (una pagina per giorno e fornitore).
// In modalità Negozio salva solo il proprio negozio: gli ordini dello stesso giorno si sommano.
function saveHistory(supId) {
  if (!db) return;
  const sup = state.suppliers.find(s => s.id === supId);
  if (!sup) return;
  const shopIds = state.mode === 'negozio' ? [state.shopId] : state.shops.filter(s => sup.shopIds.includes(s.id)).map(s => s.id);
  const draft = state.allDrafts[supId] || {};
  const upd = {};
  shopIds.forEach(shId => prodsForSupShop(supId, shId).forEach(p => {
    const k = `${p.id}_${shId}`;
    const g = state.stock[k], o = draft[k];
    const hasG = g !== undefined && g !== null && g !== '';
    const hasO = !!o && Number(o) > 0;
    if (hasG || hasO) upd[k] = { n: p.name, g: hasG ? g : '', o: hasO ? o : '' };
  }));
  if (Object.keys(upd).length) w(db.ref(`history/${supId}/${todayKey()}`).update(upd));
}

// Azzera le quantità ordinate: in modalità Negozio solo quelle del proprio negozio
function clearDraft(supId) {
  const onlyShop = state.mode === 'negozio' ? state.shopId : null;
  const cur = state.allDrafts[supId] || {};
  if (db) {
    if (onlyShop) {
      const upd = {};
      Object.keys(cur).filter(k => k.endsWith('_' + onlyShop)).forEach(k => upd[k] = null);
      if (Object.keys(upd).length) w(db.ref(`drafts/${supId}`).update(upd));
    } else {
      w(db.ref(`drafts/${supId}`).remove());
      w(db.ref(`notes/${supId}_gestione`).remove());
    }
  } else {
    if (onlyShop) Object.keys(cur).filter(k => k.endsWith('_' + onlyShop)).forEach(k => delete cur[k]);
    else delete state.allDrafts[supId];
    localStorage.setItem('gm_drafts', JSON.stringify(state.allDrafts));
  }
}

function generateOrder() {
  const msg = buildMessage();
  if (!msg) return;
  state.msgModal = msg;
  state.copied = false;
  render();
}

function renderMsgModal(app) {
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="modal-overlay">
      <div class="modal-bg" onclick="closeMsgModal()"></div>
      <div class="modal wide">
        <div class="modal-head"><h3>📋 Ordine pronto!</h3><button class="btn-icon" onclick="closeMsgModal()">✕</button></div>
        <div class="modal-body">
          <pre class="msg-box">${esc(state.msgModal)}</pre>
          <div style="display:flex;gap:12px;justify-content:flex-end">
            <button class="btn btn-secondary" onclick="closeMsgModal()">Chiudi</button>
            <button class="btn ${state.copied?'btn-green':'btn-primary'}" onclick="copyMessage()">
              ${state.copied ? '✓ Copiato!' : '📋 Copia messaggio'}
            </button>
          </div>
        </div>
      </div>
    </div>`;
  app.appendChild(div.firstElementChild);
}

function closeMsgModal() {
  const supId = state.selSup ? state.selSup.id : null;
  if (supId && confirm("Ordine inviato?\n\nOK = azzera le quantità ordinate\nAnnulla = conservale per dopo")) {
    saveHistory(supId);
    clearDraft(supId);
  }
  state.msgModal = null; state.selSup = null; state.tab = 'dash'; state.draft = {}; state.draftNote = ''; render();
}
function copyMessage() {
  navigator.clipboard.writeText(state.msgModal).then(() => { state.copied = true; render(); }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = state.msgModal;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    state.copied = true;
    render();
  });
}

function openModal(type, data) { state.modal = { type, data: JSON.parse(JSON.stringify(data)) }; render(); }
function newProduct() { openModal('product', { name:'', sid: state.suppliers[0]?.id || '', u:'', shops: state.shops.map(s=>s.id) }); }
function editProduct(id) { const p = state.products.find(x=>x.id===id); if(p) openModal('product', p); }
function newSupplier() { openModal('supplier', { name:'', note:'', shopIds: state.shops.map(s=>s.id) }); }
function editSupplier(id) { const s = state.suppliers.find(x=>x.id===id); if(s) openModal('supplier', s); }
function newShop() { openModal('shop', { name:'' }); }
function editShop(id) { const s = state.shops.find(x=>x.id===id); if(s) openModal('shop', s); }
function closeModal() { state.modal = null; render(); }

function renderModal(app) {
  const m = state.modal;
  const isEdit = !!m.data.id;
  let title = '', body = '';

  if (m.type === 'supplier') {
    title = isEdit ? 'Modifica Fornitore' : 'Nuovo Fornitore';
    const shopChips = state.shops.map(sh => `<span class="chip ${(m.data.shopIds||[]).includes(sh.id)?'active':''}" onclick="toggleModalShop('${sh.id}')">🍦 ${esc(sh.name)}</span>`).join('');
    body = `
      <div class="field"><label class="label">Nome</label><input class="input" id="m_name" value="${esc(m.data.name||'')}" placeholder="es. Molinari..."></div>
      <div class="field"><label class="label">Note ordine</label><input class="input" id="m_note" value="${esc(m.data.note||'')}" placeholder="es. Ordine entro lunedì..."></div>
      <div class="field"><label class="label">Negozi</label><div id="m_shops">${shopChips}</div></div>`;
  } else if (m.type === 'product') {
    title = isEdit ? 'Modifica Prodotto' : 'Nuovo Prodotto';
    const supOpts = state.suppliers.map(s => `<option value="${s.id}" ${s.id===m.data.sid?'selected':''}>${esc(s.name)}</option>`).join('');
    const shopChips = state.shops.map(sh => `<span class="chip ${(m.data.shops||[]).includes(sh.id)?'active':''}" onclick="toggleModalProdShop('${sh.id}')">🍦 ${esc(sh.name)}</span>`).join('');
    body = `
      <div class="field"><label class="label">Nome Prodotto</label><input class="input" id="m_name" value="${esc(m.data.name||'')}" placeholder="es. Caffè espresso..."></div>
      <div class="field"><label class="label">Fornitore</label><select class="input" id="m_sid">${supOpts}</select></div>
      <div class="field"><label class="label">Unità</label><input class="input" id="m_unit" value="${esc(m.data.u||'')}" placeholder="es. kg, litri..."></div>
      <div class="field"><label class="label">Negozi</label><div id="m_shops">${shopChips}</div></div>`;
  } else if (m.type === 'shop') {
    title = isEdit ? 'Modifica Negozio' : 'Nuovo Negozio';
    body = `<div class="field"><label class="label">Nome</label><input class="input" id="m_name" value="${esc(m.data.name||'')}" placeholder="es. Gelateria Centro..."></div>`;
  }

  const div = document.createElement('div');
  div.innerHTML = `
    <div class="modal-overlay">
      <div class="modal-bg" onclick="closeModal()"></div>
      <div class="modal">
        <div class="modal-head"><h3>${title}</h3><button class="btn-icon" onclick="closeModal()">✕</button></div>
        <div class="modal-body">
          ${body}
          <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:8px">
            <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
            <button class="btn btn-primary" onclick="saveModal()">✓ Salva</button>
          </div>
        </div>
      </div>
    </div>`;
  app.appendChild(div.firstElementChild);
}

function syncModalFields() {
  const d = state.modal.data;
  const g = id => document.getElementById(id);
  if (g('m_name')) d.name = g('m_name').value;
  if (g('m_note')) d.note = g('m_note').value;
  if (g('m_unit')) d.u = g('m_unit').value;
  if (g('m_sid')) d.sid = g('m_sid').value;
}
function toggleModalShop(id) {
  syncModalFields();
  const arr = state.modal.data.shopIds || [];
  if (arr.includes(id)) state.modal.data.shopIds = arr.filter(x => x !== id);
  else state.modal.data.shopIds = [...arr, id];
  render();
}
function toggleModalProdShop(id) {
  syncModalFields();
  const arr = state.modal.data.shops || [];
  if (arr.includes(id)) state.modal.data.shops = arr.filter(x => x !== id);
  else state.modal.data.shops = [...arr, id];
  render();
}

function saveModal() {
  const m = state.modal;
  const name = document.getElementById('m_name')?.value?.trim();
  if (!name) return;

  if (m.type === 'supplier') {
    const note = document.getElementById('m_note')?.value?.trim() || '';
    const shopIds = m.data.shopIds || [];
    if (shopIds.length === 0) return;
    if (m.data.id) {
      const i = state.suppliers.findIndex(s => s.id === m.data.id);
      if (i >= 0) state.suppliers[i] = { ...state.suppliers[i], name, note, shopIds };
    } else {
      state.suppliers.push({ id: gid(), name, note, shopIds });
    }
  } else if (m.type === 'product') {
    const sid = document.getElementById('m_sid')?.value;
    const u = document.getElementById('m_unit')?.value?.trim() || '';
    const shops = m.data.shops || [];
    if (!sid || shops.length === 0) return;
    if (m.data.id) {
      const i = state.products.findIndex(p => p.id === m.data.id);
      if (i >= 0) state.products[i] = { ...state.products[i], name, sid, u, shops };
    } else {
      state.products.push({ id: gid(), name, sid, u, shops });
    }
  } else if (m.type === 'shop') {
    if (m.data.id) {
      const i = state.shops.findIndex(s => s.id === m.data.id);
      if (i >= 0) state.shops[i] = { ...state.shops[i], name };
    } else {
      state.shops.push({ id: gid(), name });
    }
  }

  saveConfig({ supplier: 'sups', product: 'prods', shop: 'shops' }[m.type]);
  closeModal();
}

function delProduct(id) { if (!confirm('Eliminare questo prodotto?')) return; state.products = state.products.filter(p => p.id !== id); saveConfig('prods'); render(); }
function delSupplier(id) { if (!confirm('Eliminare questo fornitore e tutti i suoi prodotti?')) return; state.suppliers = state.suppliers.filter(s => s.id !== id); state.products = state.products.filter(p => p.sid !== id); saveConfig('sups', 'prods'); render(); }
function delShop(id) { if (state.shops.length <= 1) return; if (!confirm('Eliminare questo negozio?')) return; state.shops = state.shops.filter(s => s.id !== id); saveConfig('shops'); render(); }

// ── Schermata PIN ──
// Il PIN viene verificato da Firebase (accesso con password): senza PIN
// corretto il database non consegna nessun dato.
function hidePinScreen() {
  document.querySelectorAll('.pin-screen').forEach(s => s.remove());
}

function showPinScreen() {
  if (document.querySelector('.pin-screen')) return;
  let entered = "";
  let busy = false;
  const screen = document.createElement('div');
  screen.className = 'pin-screen';
  screen.innerHTML = `
    <h1>GelaMagazzino</h1>
    <div class="pin-sub">Inserisci il PIN per accedere</div>
    <div class="pin-display">${'<div class="pin-dot"></div>'.repeat(PIN_LENGTH)}</div>
    <div class="pin-pad">
      <button class="pin-key" data-k="1">1</button>
      <button class="pin-key" data-k="2">2</button>
      <button class="pin-key" data-k="3">3</button>
      <button class="pin-key" data-k="4">4</button>
      <button class="pin-key" data-k="5">5</button>
      <button class="pin-key" data-k="6">6</button>
      <button class="pin-key" data-k="7">7</button>
      <button class="pin-key" data-k="8">8</button>
      <button class="pin-key" data-k="9">9</button>
      <button class="pin-key empty"></button>
      <button class="pin-key" data-k="0">0</button>
      <button class="pin-key del" data-k="del">⌫</button>
    </div>
    <div class="pin-msg"></div>
  `;
  document.body.appendChild(screen);

  const dots = screen.querySelectorAll('.pin-dot');
  const msg = screen.querySelector('.pin-msg');

  function updateDots() {
    dots.forEach((d, i) => {
      d.classList.toggle('filled', i < entered.length);
    });
  }

  function fail(text, wait) {
    screen.classList.add('error');
    msg.textContent = text;
    setTimeout(() => {
      entered = "";
      busy = false;
      updateDots();
      screen.classList.remove('error');
      msg.textContent = '';
    }, wait);
  }

  function tryUnlock() {
    busy = true;
    msg.textContent = 'Verifica…';
    firebase.auth().signInWithEmailAndPassword(AUTH_EMAIL, entered)
      .catch(err => {
        const c = (err && err.code) || '';
        if (c === 'auth/too-many-requests') fail('Troppi tentativi. Riprova tra qualche minuto.', 4000);
        else if (c === 'auth/network-request-failed') fail('Nessuna connessione a internet.', 2500);
        else if (['auth/wrong-password', 'auth/invalid-credential', 'auth/invalid-login-credentials', 'auth/user-not-found'].includes(c)) fail('PIN errato', 900);
        else { console.error("Errore accesso:", err); fail('Accesso non riuscito (' + c + ')', 4000); }
      });
    // se il PIN è giusto, onAuthStateChanged chiude questa schermata
  }

  screen.querySelectorAll('.pin-key').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.k;
      if (!k || busy) return;
      if (k === 'del') {
        entered = entered.slice(0, -1);
        updateDots();
      } else if (entered.length < PIN_LENGTH) {
        entered += k;
        updateDots();
        if (entered.length === PIN_LENGTH) {
          setTimeout(tryUnlock, 150);
        }
      }
    });
  });
}

function lockApp() {
  if (!confirm('Uscire? Per rientrare servirà il PIN.')) return;
  firebase.auth().signOut();
}

// ── Init ──
try { localStorage.removeItem('gm_pin_ok'); } catch(e) {}
initFirebase();
</script>
