<style>
:root{--bg:#faf8f5;--card:#fff;--brown:#d4a574;--brown2:#c4956a;--dark:#2d2118;--dark2:#3d2e22;--text:#1a1a2e;--muted:#999;--border:#f0ece8;--green:#4a9e6a;--blue:#8b9dc3;--red:#e07b4c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}

.header{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;padding:18px 24px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.header h1{font-family:'Playfair Display',serif;font-size:20px;font-weight:700}
.header small{font-size:11px;opacity:.7;letter-spacing:1px;display:block}
.header .mode-badge{margin-left:auto;background:rgba(255,255,255,.12);border:none;border-radius:10px;padding:8px 14px;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}

.nav{display:flex;background:var(--card);border-bottom:1px solid #eee;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.nav button{flex:1;padding:12px 8px;border:none;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;font-weight:600;border-bottom:3px solid transparent;transition:.2s}
.nav button.active{background:var(--bg);color:var(--brown);border-bottom-color:var(--brown)}

main{max-width:800px;margin:0 auto;padding:16px 16px 100px}

.card{background:var(--card);border-radius:14px;padding:16px 20px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card-accent{border-left:4px solid var(--brown)}
.card h4{font-size:16px;font-weight:700;margin-bottom:4px}
.card .sub{font-size:12px;color:#b0a090}
.card .count{font-size:12px;color:var(--muted);margin-top:4px}

.badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;display:inline-block;margin:2px}
.badge-on{background:#e8f5e8;color:#5a8a5a}
.badge-off{background:#f5f0eb;color:#ccc}

.btn{border:none;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--brown),var(--brown2));color:#fff;box-shadow:0 2px 8px rgba(196,149,106,.3)}
.btn-secondary{background:#f5f0eb;color:#8b7355}
.btn-green{background:linear-gradient(135deg,var(--green),#3d8a5a);color:#fff;box-shadow:0 2px 8px rgba(74,158,106,.3)}
.btn-small{padding:6px 12px;font-size:12px}
.btn-icon{background:none;border:none;padding:4px;color:#aaa}
.btn-icon.danger{color:#daa}

.chip{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:2px solid #e0dbd5;background:#fff;color:#888;display:inline-block;margin:3px}
.chip.active{border-color:var(--brown);background:var(--brown);color:#fff}

.input{width:100%;padding:10px 14px;border:2px solid #e8e8ef;border-radius:10px;font-size:14px;outline:none}
.input:focus{border-color:var(--brown)}
.label{display:block;font-size:13px;font-weight:600;color:#555;margin-bottom:6px}
.field{margin-bottom:18px}

.grid-row{display:grid;grid-template-columns:1fr 80px 80px;gap:8px;padding:12px 16px;align-items:center;border-left:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.grid-row:nth-child(odd){background:#fff}
.grid-row:nth-child(even){background:#fdfcfa}
.grid-header{display:grid;grid-template-columns:1fr 80px 80px;gap:8px;padding:10px 16px;font-size:11px;font-weight:700;color:var(--muted);background:#f5f0eb;text-transform:uppercase;letter-spacing:.5px}
.grid-header span:not(:first-child),.grid-row span:not(:first-child){text-align:center}

.inv-input{width:100%;text-align:center;padding:8px 4px;border:2px solid #e8e8ef;border-radius:8px;font-size:15px;outline:none;background:#fef9f3}
.ord-input{width:100%;text-align:center;padding:8px 4px;border:2px solid var(--brown);border-radius:8px;font-size:15px;font-weight:600;outline:none;background:#fff8f0}

.shop-tabs{display:flex;background:var(--card);border-radius:14px 14px 0 0;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.shop-tab{flex:1;padding:12px 10px;border:none;background:var(--card);color:#888;font-weight:700;font-size:13px;border-bottom:2px solid var(--border);font-family:inherit}
.shop-tab.active{background:var(--brown);color:#fff;border-bottom:none}

.section-title{margin:8px 0 12px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.section-sub{margin:2px 0 0 28px;font-size:12px;color:#aaa}

.empty{background:var(--card);border-radius:14px;padding:28px 20px;text-align:center;color:#bbb;font-size:14px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.04)}

.modal-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.modal{position:relative;background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:85vh;overflow:auto;box-shadow:0 24px 64px rgba(0,0,0,.2)}
.modal.wide{max-width:720px}
.modal-head{position:sticky;top:0;background:#fff;padding:20px 24px 12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;z-index:1}
.modal-head h3{font-size:18px;font-weight:700}
.modal-body{padding:24px}

.msg-box{background:var(--bg);border-radius:12px;padding:20px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word;border:1px solid #e8e8ef;margin-bottom:20px}

.setup-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
.setup-card{background:var(--card);border-radius:20px;padding:40px;max-width:420px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.1)}

.note-area{width:100%;padding:12px 14px;border:2px solid #e8e8ef;border-radius:10px;font-size:14px;outline:none;resize:vertical;background:#fff;font-family:inherit;min-height:80px}

.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.sync-dot.on{background:#4a9e6a}
.sync-dot.off{background:#e07b4c}

.list-item{padding:12px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}

.supplier-section{margin-bottom:24px}
.supplier-section h4{font-size:13px;font-weight:700;color:var(--brown);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}

@media(max-width:400px){
  .grid-header,.grid-row{grid-template-columns:1fr 65px 65px;gap:4px;padding:10px 12px}
  .shop-tab{font-size:12px;padding:10px 6px}
}

    // Listen for config
    db.ref('config').on('value', snap => {
      const d = snap.val();
      if (d) {
        state.shops = d.shops || DEFAULTS.shops;
        state.suppliers = d.sups || DEFAULTS.suppliers;
        state.products = d.prods || DEFAULTS.products;
      } else {
        // First time: write defaults
        state.shops = DEFAULTS.shops;
        state.suppliers = DEFAULTS.suppliers;
        state.products = DEFAULTS.products;
        db.ref('config').set({ shops: state.shops, sups: state.suppliers, prods: state.products });
      }
      render();
    });

    // Listen for stock
    db.ref('stock').on('value', snap => {
      state.stock = snap.val() || {};
      render();
    });

    // Listen for notes
    db.ref('notes').on('value', snap => {
      state.notes = snap.val() || {};
      render();
    });

  } catch(e) {
    console.error("Firebase error:", e);
    loadFromLocal();
    render();
  }
}

function loadFromLocal() {
  try {
    const d = JSON.parse(localStorage.getItem('gm_data') || 'null');
    if (d) {
      state.shops = d.shops || DEFAULTS.shops;
      state.suppliers = d.sups || DEFAULTS.suppliers;
      state.products = d.prods || DEFAULTS.products;
      state.stock = d.stock || {};
      state.notes = d.notes || {};
    } else {
      state.shops = DEFAULTS.shops;
      state.suppliers = DEFAULTS.suppliers;
      state.products = DEFAULTS.products;
    }
  } catch(e) {
    state.shops = DEFAULTS.shops;
    state.suppliers = DEFAULTS.suppliers;
    state.products = DEFAULTS.products;
  }
}

function saveConfig() {
  if (db) {
    db.ref('config').set({ shops: state.shops, sups: state.suppliers, prods: state.products });
  } else {
    localStorage.setItem('gm_data', JSON.stringify({ shops: state.shops, sups: state.suppliers, prods: state.products, stock: state.stock, notes: state.notes }));
  }
}

function saveStock(prodId, shopId, val) {
  const key = `${prodId}_${shopId}`;
  state.stock[key] = val;
  if (db) {
    db.ref(`stock/${key}`).set(val);
  } else {
    localStorage.setItem('gm_data', JSON.stringify({ shops: state.shops, sups: state.suppliers, prods: state.products, stock: state.stock, notes: state.notes }));
  }
}

function saveNote(supId, shopId, text) {
  const key = `${supId}_${shopId}`;
  state.notes[key] = { text, date: new Date().toISOString() };
  if (db) {
    db.ref(`notes/${key}`).set(state.notes[key]);
  } else {
    localStorage.setItem('gm_data', JSON.stringify({ shops: state.shops, sups: state.suppliers, prods: state.products, stock: state.stock, notes: state.notes }));
  }
}

// ── Helpers ──
function gid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function prodsForSup(supId) { return state.products.filter(p => p.sid === supId); }
function prodsForSupShop(supId, shopId) { return state.products.filter(p => p.sid === supId && p.shops.includes(shopId)); }
function shopName(id) { return (state.shops.find(s => s.id === id) || {}).name || '?'; }

// ── Build Order Message ──
function buildMessage() {
  const sup = state.selSup;
  if (!sup) return null;
  const lines = [`📋 ORDINE ${sup.name}`, `📅 ${new Date().toLocaleDateString("it-IT")}`, ''];
  let hasItems = false;
  const relShops = state.shops.filter(s => sup.shopIds.includes(s.id));
  relShops.forEach(sh => {
    const items = [];
    prodsForSupShop(sup.id, sh.id).forEach(p => {
      const q = state.draft[`${p.id}_${sh.id}`];
      if (q && Number(q) > 0) items.push({ name: p.name, qty: Number(q), unit: p.u });
    });
    if (items.length > 0) {
      hasItems = true;
      lines.push(`🍦 ${sh.name.toUpperCase()}:`);
      items.forEach(it => lines.push(`• ${it.name} — ${it.qty}${it.u ? ' ' + it.u : ''}`));
      lines.push('');
    }
  });
  if (state.draftNote.trim()) { lines.push(`📝 Note: ${state.draftNote.trim()}`); lines.push(''); }
  if (!hasItems && !state.draftNote.trim()) return null;
  return lines.join('\n');
}

// RENDER

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  // ── Setup Screen ──
  if (!state.mode) {
    app.appendChild(renderSetup());
    return;
  }

  // ── Header ──
  const myShop = state.shops.find(s => s.id === state.shopId);
  const modeLabel = state.mode === 'negozio' ? `🍦 ${myShop ? myShop.name : ''}` : '👤 Gestione';

  app.innerHTML = `
    <div class="header">
      <span style="font-size:28px">🍦</span>
      <div>
        <h1>GelaMagazzino</h1>
        <small>${DAYS[new Date().getDay()].toUpperCase()} — ${new Date().toLocaleDateString("it-IT")}</small>
      </div>
      <button class="mode-badge" onclick="resetMode()">
        <span class="sync-dot ${connected ? 'on' : 'off'}"></span>
        ${modeLabel}
      </button>
    </div>
  `;

  if (state.mode === 'negozio') {
    renderNegozio(app);
  } else {
    renderGestione(app);
  }

  // Render modal if open
  if (state.modal) renderModal(app);
  if (state.msgModal) renderMsgModal(app);
}

// NEGOZIO MODE

        </div>`;
    });

    // Giacenze form for selected supplier
    const sup = state.selSup;
    const prods = prodsForSupShop(sup.id, shopId);
    const noteKey = `${sup.id}_${shopId}`;

    html += `<button class="btn btn-secondary btn-small" style="margin-bottom:16px" onclick="closeNegozioSup()">← Torna ai fornitori</button>`;
    html += `<div class="card" style="background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;margin-bottom:20px">
      <h2 style="font-family:'Playfair Display',serif;font-size:20px">${sup.name}</h2>
      ${sup.note ? `<p style="font-size:13px;opacity:.7">${sup.note}</p>` : ''}
    </div>`;

    html += `<div class="grid-header"><span>Prodotto</span><span>📦 Giac.</span><span>🛒 Ord.</span></div>`;
    prods.forEach((p, i) => {
      const val = state.stock[`${p.id}_${shopId}`] || '';
      const ord = state.draft[`${p.id}_${shopId}`] || '';
      html += `<div class="grid-row">
        <div><strong style="font-size:14px">${p.name}</strong>${p.u ? ` <span style="font-size:11px;color:#aaa">(${p.u})</span>` : ''}</div>
        <input class="inv-input" type="number" min="0" step="any" placeholder="—" value="${val}" onchange="saveStock('${p.id}','${shopId}',this.value)">
        <input class="ord-input" type="number" min="0" step="any" placeholder="—" value="${ord}" onchange="setDraft('${p.id}','${shopId}',this.value)">
      </div>`;
    });

    // Count
    const totalOrd = Object.entries(state.draft).filter(([,q]) => q && Number(q) > 0).length;
    if (totalOrd > 0) {
      html += `<div style="background:#f0ebe4;border-radius:12px;padding:12px 16px;margin-top:16px;font-size:13px;color:#6b5d4f"><strong>${totalOrd}</strong> prodotti nell'ordine</div>`;

function openNegozioSup(supId) {
  state.selSup = state.suppliers.find(s => s.id === supId);
  state.draft = {};
  state.tab = 'order';
  render();
}

function closeNegozioSup() {
  state.selSup = null;
  state.draft = {};
  state.tab = 'dash';
  render();
}

function generateNegozioOrder(supId) {
  const sup = state.suppliers.find(s => s.id === supId);
  if (!sup) return;
  const shopId = state.shopId;
  const shop = state.shops.find(s => s.id === shopId);
  const lines = [`📋 ORDINE ${sup.name}`, `📅 ${new Date().toLocaleDateString("it-IT")}`, ''];
  const items = [];
  prodsForSupShop(sup.id, shopId).forEach(p => {
    const q = state.draft[`${p.id}_${shopId}`];
    if (q && Number(q) > 0) items.push({ name: p.name, qty: Number(q), unit: p.u });
  });
  if (items.length > 0) {
    lines.push(`🍦 ${shop ? shop.name.toUpperCase() : ''}:`);
    items.forEach(it => lines.push(`• ${it.name} — ${it.qty}${it.u ? ' ' + it.u : ''}`));
    lines.push('');
  }
  const noteKey = `${sup.id}_${shopId}`;
  const n = state.notes[noteKey];
  if (n && n.text) { lines.push(`📝 Note: ${n.text}`); lines.push(''); }
  if (items.length === 0 && !(n && n.text)) return;
  state.msgModal = lines.join('\n');
  state.copied = false;
  render();
}

    </div>`;
    state.shops.forEach(sh => {
      const nSup = state.suppliers.filter(s => s.shopIds.includes(sh.id)).length;
      const nProd = state.products.filter(p => p.shops.includes(sh.id)).length;
      html += `<div class="card" style="display:flex;justify-content:space-between;align-items:center">
        <div><strong style="font-size:15px">${sh.name}</strong><p class="count">${nSup} fornitori · ${nProd} prodotti</p></div>
        <div style="display:flex;gap:6px">
          <button class="btn-icon" onclick="editShop('${sh.id}')"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
          ${state.shops.length>1?`<button class="btn-icon danger" onclick="delShop('${sh.id}')"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>`:''}
        </div>
      </div>`;
    });
  }

  html += '</main>';
  app.insertAdjacentHTML('beforeend', html);
}

// ── Actions ──
function setTab(t) { state.tab = t; state.selSup = null; render(); }
function startOrder(supId) { state.selSup = state.suppliers.find(s => s.id === supId); state.draft = {}; state.draftNote = ''; state.tab = 'order'; const rs = state.shops.filter(s => state.selSup.shopIds.includes(s.id)); state.shopTab = rs[0]?.id; render(); }
function setShopTab(id) { state.shopTab = id; render(); }
function cancelOrder() { state.selSup = null; state.tab = 'dash'; state.draft = {}; state.draftNote = ''; render(); }
function setDraft(pid, sid, val) { state.draft[`${pid}_${sid}`] = val; }

function generateOrder() {
  const msg = buildMessage();
  if (!msg) return;
  state.msgModal = msg;
  state.copied = false;
  render();
}

function renderMsgModal(app) {
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="modal-overlay">
      <div class="modal-bg" onclick="closeMsgModal()"></div>
      <div class="modal wide">
        <div class="modal-head"><h3>📋 Ordine pronto!</h3><button class="btn-icon" onclick="closeMsgModal()">✕</button></div>
        <div class="modal-body">
          <pre class="msg-box">${state.msgModal}</pre>
          <div style="display:flex;gap:12px;justify-content:flex-end">
            <button class="btn btn-secondary" onclick="closeMsgModal()">Chiudi</button>
            <button class="btn ${state.copied?'btn-green':'btn-primary'}" onclick="copyMessage()">
              ${state.copied ? '✓ Copiato!' : '📋 Copia messaggio'}
            </button>
          </div>
        </div>
      </div>
    </div>`;
  app.appendChild(div.firstElementChild);
}

function closeMsgModal() { state.msgModal = null; state.selSup = null; state.tab = 'dash'; state.draft = {}; state.draftNote = ''; render(); }
function copyMessage() {
  navigator.clipboard.writeText(state.msgModal).then(() => { state.copied = true; render(); }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = state.msgModal;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    state.copied = true;
    render();
  });
}

// ── CRUD ──
function openModal(type, data) { state.modal = { type, data: JSON.parse(JSON.stringify(data)) }; render(); }
function newProduct() { openModal('product', { name:'', sid: state.suppliers[0]?.id || '', u:'', shops: state.shops.map(s=>s.id) }); }
function editProduct(id) { const p = state.products.find(x=>x.id===id); if(p) openModal('product', p); }
function newSupplier() { openModal('supplier', { name:'', note:'', shopIds: state.shops.map(s=>s.id) }); }
function editSupplier(id) { const s = state.suppliers.find(x=>x.id===id); if(s) openModal('supplier', s); }
function newShop() { openModal('shop', { name:'' }); }
function editShop(id) { const s = state.shops.find(x=>x.id===id); if(s) openModal('shop', s); }
function closeModal() { state.modal = null; render(); }

function renderModal(app) {
  const m = state.modal;
  const isEdit = !!m.data.id;
  let title = '', body = '';

  if (m.type === 'supplier') {
    title = isEdit ? 'Modifica Fornitore' : 'Nuovo Fornitore';
    const shopChips = state.shops.map(sh => `<span class="chip ${(m.data.shopIds||[]).includes(sh.id)?'active':''}" onclick="toggleModalShop('${sh.id}')">🍦 ${sh.name}</span>`).join('');
    body = `
      <div class="field"><label class="label">Nome</label><input class="input" id="m_name" value="${m.data.name||''}" placeholder="es. Molinari..."></div>
      <div class="field"><label class="label">Note ordine</label><input class="input" id="m_note" value="${m.data.note||''}" placeholder="es. Ordine entro lunedì..."></div>
      <div class="field"><label class="label">Negozi</label><div id="m_shops">${shopChips}</div></div>`;
  } else if (m.type === 'product') {
    title = isEdit ? 'Modifica Prodotto' : 'Nuovo Prodotto';
    const supOpts = state.suppliers.map(s => `<option value="${s.id}" ${s.id===m.data.sid?'selected':''}>${s.name}</option>`).join('');
    const shopChips = state.shops.map(sh => `<span class="chip ${(m.data.shops||[]).includes(sh.id)?'active':''}" onclick="toggleModalProdShop('${sh.id}')">🍦 ${sh.name}</span>`).join('');
    body = `
      <div class="field"><label class="label">Nome Prodotto</label><input class="input" id="m_name" value="${m.data.name||''}" placeholder="es. Caffè espresso..."></div>
      <div class="field"><label class="label">Fornitore</label><select class="input" id="m_sid">${supOpts}</select></div>
      <div class="field"><label class="label">Unità</label><input class="input" id="m_unit" value="${m.data.u||''}" placeholder="es. kg, litri..."></div>
      <div class="field"><label class="label">Negozi</label><div id="m_shops">${shopChips}</div></div>`;
  } else if (m.type === 'shop') {
    title = isEdit ? 'Modifica Negozio' : 'Nuovo Negozio';
    body = `<div class="field"><label class="label">Nome</label><input class="input" id="m_name" value="${m.data.name||''}" placeholder="es. Gelateria Centro..."></div>`;
  }

  const div = document.createElement('div');
  div.innerHTML = `
    <div class="modal-overlay">
      <div class="modal-bg" onclick="closeModal()"></div>
      <div class="modal">
        <div class="modal-head"><h3>${title}</h3><button class="btn-icon" onclick="closeModal()">✕</button></div>
        <div class="modal-body">
          ${body}
          <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:8px">
            <button class="btn btn-secondary" onclick="closeModal()">Annulla</button>
            <button class="btn btn-primary" onclick="saveModal()">✓ Salva</button>
          </div>
        </div>
      </div>
    </div>`;
  app.appendChild(div.firstElementChild);
}

function toggleModalShop(id) {
  const arr = state.modal.data.shopIds || [];
  if (arr.includes(id)) state.modal.data.shopIds = arr.filter(x => x !== id);
  else state.modal.data.shopIds = [...arr, id];
  render();
}
function toggleModalProdShop(id) {
  const arr = state.modal.data.shops || [];
  if (arr.includes(id)) state.modal.data.shops = arr.filter(x => x !== id);
  else state.modal.data.shops = [...arr, id];
  render();
}

function saveModal() {
  const m = state.modal;
  const name = document.getElementById('m_name')?.value?.trim();
  if (!name) return;

  if (m.type === 'supplier') {
    const note = document.getElementById('m_note')?.value?.trim() || '';
    const shopIds = m.data.shopIds || [];
    if (shopIds.length === 0) return;
    if (m.data.id) {
      const i = state.suppliers.findIndex(s => s.id === m.data.id);
      if (i >= 0) state.suppliers[i] = { ...state.suppliers[i], name, note, shopIds };
    } else {
      state.suppliers.push({ id: gid(), name, note, shopIds });
    }
  } else if (m.type === 'product') {
    const sid = document.getElementById('m_sid')?.value;
    const u = document.getElementById('m_unit')?.value?.trim() || '';
    const shops = m.data.shops || [];
    if (!sid || shops.length === 0) return;
    if (m.data.id) {
      const i = state.products.findIndex(p => p.id === m.data.id);
      if (i >= 0) state.products[i] = { ...state.products[i], name, sid, u, shops };
    } else {
      state.products.push({ id: gid(), name, sid, u, shops });
    }
  } else if (m.type === 'shop') {
    if (m.data.id) {
      const i = state.shops.findIndex(s => s.id === m.data.id);
      if (i >= 0) state.shops[i] = { ...state.shops[i], name };
    } else {
      state.shops.push({ id: gid(), name });
    }
  }

  saveConfig();
  closeModal();
}

function delProduct(id) { if (!confirm('Eliminare questo prodotto?')) return; state.products = state.products.filter(p => p.id !== id); saveConfig(); render(); }
function delSupplier(id) { if (!confirm('Eliminare questo fornitore e tutti i suoi prodotti?')) return; state.suppliers = state.suppliers.filter(s => s.id !== id); state.products = state.products.filter(p => p.sid !== id); saveConfig(); render(); }
function delShop(id) { if (state.shops.length <= 1) return; if (!confirm('Eliminare questo negozio?')) return; state.shops = state.shops.filter(s => s.id !== id); saveConfig(); render(); }

// ── Init ──
initFirebase();
if (!state.mode) render();
</script>
</body>
</html>
